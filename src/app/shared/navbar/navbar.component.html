
<header class="app-navbar">
  <a class="brand" routerLink="/home" (click)="closeMenu()" aria-label="Ogbia Connect home">
    <span class="brand-copy"><strong>My Ogbia</strong><small>Our people. One community.</small></span>
  </a>

  <nav class="desktop-links" aria-label="Main navigation">
    <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Home</a>
    <a routerLink="/friends" routerLinkActive="active">Friends</a>
    <a routerLink="/constituency" routerLinkActive="active">My Ogbia</a>
    <a routerLink="/reps" routerLinkActive="active">Representatives</a>
  </nav>

  <div class="navbar-actions">
    <button class="notification-action" type="button" (click)="refreshNotifications()" [attr.aria-label]="'Notifications, ' + ((notifications.unreadCount$ | async) || 0) + ' unread'" title="Unread notifications">
      <ion-icon name="notifications-outline"></ion-icon>
      @if ((notifications.unreadCount$ | async); as unreadCount) {
        @if (unreadCount > 0) {
          <span class="notification-badge" aria-hidden="true">{{ unreadCount > 99 ? '99+' : unreadCount }}</span>
        }
      }
    </button>
    <a class="profile-action" routerLink="/profile" routerLinkActive="active" aria-label="Your profile">
      <ion-icon name="person-circle-outline"></ion-icon><span>Profile</span>
    </a>
    <button class="menu-toggle" type="button" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen" aria-controls="mobile-navigation" [attr.aria-label]="menuOpen ? 'Close navigation menu' : 'Open navigation menu'">
      <ion-icon [name]="menuOpen ? 'close-outline' : 'menu-outline'"></ion-icon>
    </button>
  </div>

  @if (menuOpen) {
    <nav id="mobile-navigation" class="mobile-links" aria-label="Mobile navigation">
      <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" (click)="closeMenu()"><ion-icon name="home-outline"></ion-icon>Home</a>
      <a routerLink="/friends" routerLinkActive="active" (click)="closeMenu()"><ion-icon name="people-outline"></ion-icon>Friends</a>
      <a routerLink="/constituency" routerLinkActive="active" (click)="closeMenu()"><ion-icon name="map-outline"></ion-icon>My Ogbia</a>
      <a routerLink="/reps" routerLinkActive="active" (click)="closeMenu()"><ion-icon name="people-circle-outline"></ion-icon>Representatives</a>
      <a routerLink="/services" routerLinkActive="active" (click)="closeMenu()"><ion-icon name="briefcase-outline"></ion-icon>Services</a>
      <a routerLink="/account-security" routerLinkActive="active" (click)="closeMenu()"><ion-icon name="settings-outline"></ion-icon>Account</a>
      <a routerLink="/account-security" routerLinkActive="active" (click)="closeMenu()"><ion-icon name="shield-checkmark-outline"></ion-icon>Security</a>
      <a routerLink="/profile" routerLinkActive="active" (click)="closeMenu()"><ion-icon name="person-outline"></ion-icon>Profile</a>
      <a routerLink="/create-post" routerLinkActive="active" (click)="closeMenu()"><ion-icon name="create-outline"></ion-icon>Create a post</a>
    </nav>
  }
</header>

<nav class="app-bottom-nav" aria-label="Primary bottom navigation">
  <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }" aria-label="Home">
    <ion-icon name="home-outline"></ion-icon><span>Home</span>
  </a>
  <a routerLink="/friends" routerLinkActive="active" aria-label="Friends">
    <ion-icon name="people-outline"></ion-icon><span>Friends</span>
  </a>
  <a class="create-nav" routerLink="/create-post" routerLinkActive="active" aria-label="Create a post">
    <span class="create-nav-icon"><ion-icon name="add"></ion-icon></span><span>Create</span>
  </a>
  <a class="my-ogbia-nav" routerLink="/constituency" routerLinkActive="active" aria-label="My Ogbia knowledge base" title="My Ogbia">
    <ion-icon name="map-outline"></ion-icon><span class="bottom-nav-label">My Ogbia</span>
  </a>
  <a routerLink="/profile" routerLinkActive="active" aria-label="Profile">
    <ion-icon name="person-circle-outline"></ion-icon><span>Profile</span>
  </a>
</nav>
