<ion-content [fullscreen]="true" class="welcome-content">
  <div class="welcome-shell" style="background-image: url(assets/images/splash.png); background-size: cover; background-position: center; background-repeat: no-repeat;">
    <div id="carouselExampleIndicators" class="carousel slide d-none">
  <div class="carousel-indicators">
    <i class="dot" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></i>
    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="1" aria-label="Slide 2"></button>
    <button type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide-to="2" aria-label="Slide 3"></button>
  </div>
  <div class="carousel-inner">
    <div class="carousel-item active">
      <img src="assets/images/bc7f1fa3-b007-4d93-81d5-ecbe7db5fd25.png" class="d-block w-100" alt="...">
    </div>
    <div class="carousel-item">
      <img src="assets/images/98987c87-7750-4ea2-b018-7bbc36aa806f.png" class="d-block w-100" alt="...">
    </div>
    <div class="carousel-item">
      <img src="assets/images/500ce5ed-1b59-496d-82e5-132c5eb7c11e.png" class="d-block w-100" alt="...">
    </div>
  </div>
  <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
    <span class="visually-hidden">Previous</span>
  </button>
  <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
    <span class="visually-hidden">Next</span>
  </button>
</div>
    <div class="shade d-none"></div>

    <div class="copy fade-up d-none"  >
      <h1>Ogbia,<br><span>One</span> Community.<br><span>No</span> Distance.<br><span>We Are One.</span></h1>
      <p>Stay connected, participate<br>and build a better Ogbia<br>together.</p>
    </div>
    <div class="actions fade-up delay-2" ><a routerLink="/get_started" class="btn btn-light">Join Ogbia Connect</a></div>
  </div>
</ion-content>
