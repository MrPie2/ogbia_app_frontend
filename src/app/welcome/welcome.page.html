<ion-content [fullscreen]="true" [scrollY]="false" class="welcome-content">
  <main class="welcome-shell" [class.is-leaving]="isLeaving">
    <span class="welcome-orb orb-top-left" aria-hidden="true"></span>
    <span class="welcome-orb orb-top-right" aria-hidden="true"></span>
    <span class="welcome-orb orb-bottom-right" aria-hidden="true"></span>

    <img class="welcome-tree" src="assets/images/ogbia-tree.svg" alt="" aria-hidden="true">

    <div class="welcome-logo" aria-label="myOGBIA">
      <span class="logo-mark" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="logo-word">myOGBIA</span>
    </div>

    <div class="welcome-actions">
      <button type="button" class="join-button" (click)="openLogin()" [disabled]="isLeaving">
        Join Ogbia Connect
      </button>
      <a routerLink="/family/claim" class="family-invitation">
        Or have a family invitation? Claim your Profile
      </a>
    </div>

    <p class="welcome-footer">powered by ogbia.com</p>
  </main>
</ion-content>
