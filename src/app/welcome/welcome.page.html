<ion-content [fullscreen]="true" [scrollY]="false" class="welcome-content">
  <main class="welcome-shell" [class.is-leaving]="isLeaving">
    

    <img class="welcome-tree" src="assets/images/ogbia-tree.svg" alt="" aria-hidden="true">

    <div class="welcome-log" aria-label="myOGBI">
                <img class="welcome-tree" src="assets/images/ogbialogo.png" alt="" aria-hidden="true" style="margin-top: 5cm; width: 90px; height: 70px">

    </div>

    <div class="welcome-actions">

      <button type="button" class="join-button btn-sm" (click)="openLogin()" [disabled]="isLeaving">
        Join Ogbia Connect
      </button>
      <a routerLink="/family/claim" class="family-invitation">
        Or have a family invitation? Claim your Profile
      </a>
    </div>

    <p class="welcome-footer" style="font-size: 8pt">powered by ogbia.com</p>
  </main>
</ion-content>
