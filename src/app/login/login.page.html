<ion-content [fullscreen]="true" [scrollY]="false" class="login-content">
  <main class="login-shell">
    <a class="back-link" routerLink="/welcome" aria-label="Back to welcome">
      <ion-icon name="arrow-back-outline"></ion-icon><span>Back</span>
    </a>

    <section class="login-intro">
      <div class="brand-mark" aria-hidden="true"><ion-icon name="people-circle-outline"></ion-icon></div>
      <p class="eyebrow">OGBIA CONNECT COMMUNITY</p>
      <h1>Welcome back.</h1>
      <p class="intro-copy">Log in to stay connected with your people.</p>
    </section>

    <form class="login-card" (ngSubmit)="login()" #loginForm="ngForm">
      <div class="field">
        <label for="phoneNumber">Phone number</label>
        <div class="input-wrap">
          <ion-icon name="call-outline" aria-hidden="true"></ion-icon>
          <input id="phoneNumber" name="phoneNumber" type="tel" inputmode="tel" autocomplete="tel"
            [(ngModel)]="phoneNumber" placeholder="e.g. +234 801 234 5678" required maxlength="20">
        </div>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="input-wrap">
          <ion-icon name="lock-closed-outline" aria-hidden="true"></ion-icon>
          <input id="password" name="password" type="password" autocomplete="current-password"
            [(ngModel)]="password" placeholder="Enter your password" required>
        </div>
      </div>

      @if (errorMessage) {
        <p class="login-error" role="alert">{{ errorMessage }}</p>
      }

      <button class="submit-button" type="submit" [disabled]="loading || !loginForm.valid">
        <span>{{ loading ? 'Signing in…' : 'Log in' }}</span>
        @if (!loading) { <ion-icon name="arrow-forward-outline"></ion-icon> }
        @if (loading) { <span class="button-spinner" aria-hidden="true"></span> }
      </button>

      <p class="signup-prompt">New to Ogbia Connect? <a routerLink="/get_started">Create an account</a></p>
    </form>
  </main>
</ion-content>
