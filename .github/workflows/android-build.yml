name: Build Ogbia Android APK

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: 'Android APK versionName (for example 1.0.4)'
        required: true
        default: '1.0.4'
        type: string
      app_version_code:
        description: 'Android APK versionCode; increase for every APK release'
        required: true
        default: '5'
        type: string
      bundle_version:
        description: 'SemVer for the live-update bundle (for example 1.0.4)'
        required: true
        default: '1.0.4'
        type: string

permissions:
  contents: read

concurrency:
  group: ogbia-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK platform and build tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Node dependencies
        run: npm ci

      - name: Set Android APK version
        shell: bash
        env:
          APP_VERSION: ${{ inputs.app_version }}
          APP_VERSION_CODE: ${{ inputs.app_version_code }}
        run: |
          if ! [[ "$APP_VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "app_version_code must be a positive integer" >&2
            exit 1
          fi
          sed -i "s/versionCode [0-9][0-9]*/versionCode $APP_VERSION_CODE/" android/app/build.gradle
          VERSION_ESCAPED=$(printf '%s' "$APP_VERSION" | sed 's/[&/]/\\\\&/g')
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION_ESCAPED\"/" android/app/build.gradle
          grep -E 'versionCode|versionName' android/app/build.gradle

      - name: Build Ionic and Angular production app
        run: npm run build -- --configuration production

      - name: Create self-hosted live-update bundle
        shell: bash
        env:
          BUNDLE_VERSION: ${{ inputs.bundle_version }}
        run: |
          BUNDLE_FILE="ogbia-live-update-$BUNDLE_VERSION.zip"
          npx --yes @capgo/cli@latest bundle zip com.myogbia.app --path www --bundle "$BUNDLE_VERSION" --name "$BUNDLE_FILE" --json | tee bundle-info.json
          test -f "$BUNDLE_FILE"
          cp "$BUNDLE_FILE" ogbia-live-update.zip

      - name: Upload live-update bundle
        uses: actions/upload-artifact@v4
        with:
          name: ogbia-live-update-${{ inputs.bundle_version }}
          path: |
            ogbia-live-update.zip
            bundle-info.json
          if-no-files-found: error
          retention-days: 30

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Restore Android release keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64" || { echo "Missing ANDROID_KEYSTORE_BASE64 repository secret" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/ogbia-signing"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ogbia-signing/ogbia-release-secure.jks"
          test -s "$RUNNER_TEMP/ogbia-signing/ogbia-release-secure.jks"

      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/ogbia-signing/ogbia-release-secure.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "Missing ANDROID_KEYSTORE_PASSWORD repository secret" >&2; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "Missing ANDROID_KEY_ALIAS repository secret" >&2; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "Missing ANDROID_KEY_PASSWORD repository secret" >&2; exit 1; }
          bash ./gradlew assembleRelease --no-daemon

      - name: Verify APK signature
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          apksigner verify --verbose "$APK"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ogbia-android-signed-${{ inputs.app_version }}-code-${{ inputs.app_version_code }}
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
