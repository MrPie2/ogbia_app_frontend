name: Build Ogbia Android APK

on:
  workflow_dispatch:
    inputs:
      bundle_version:
        description: 'SemVer for the live-update bundle (for example 1.0.1)'
        required: true
        default: '1.0.1'
        type: string

permissions:
  contents: read

concurrency:
  group: ogbia-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK platform and build tools
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Install Node dependencies
        run: npm ci

      - name: Build Ionic and Angular production app
        run: npm run build -- --configuration production

      - name: Create self-hosted live-update bundle
        run: npx --yes @capgo/cli@latest bundle zip com.myogbia.app --path www --bundle "${{ inputs.bundle_version }}" --name ogbia-live-update --json

      - name: Upload live-update bundle
        uses: actions/upload-artifact@v4
        with:
          name: ogbia-live-update-${{ inputs.bundle_version }}
          path: ogbia-live-update.zip
          if-no-files-found: error
          retention-days: 30

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: bash ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ogbia-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
